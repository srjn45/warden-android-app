name: Android CI

# Builds the debug APK and runs the JVM unit tests on every push to main, every
# PR, and on demand. No daemon is reachable in CI, so the env-gated
# LiveDaemonIntegrationTest self-skips.
#
# Artifacts are deliberately sparse: the debug APK is uploaded only on manual
# (workflow_dispatch) runs, and the unit-test report only when something failed.
# Uploading both on every push was exhausting the account's Actions
# artifact-storage quota, which failed the upload steps and turned CI red even
# though the build+tests passed. The uploads are also continue-on-error, so a
# quota hit can never fail the job. Need a debug APK for sideloading? Trigger the
# workflow manually; the signed release APK comes from android-release.yml.
#
# The app is pure Kotlin + Gradle (no Node/Expo/NDK), so this is much lighter
# than the Expo release-mobile.yml this repo's siblings use — just JDK 17 + the
# Android SDK (android-36 platform, build-tools 34.0.0 = AGP 8.6.1's default).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        # compileSdk 36 needs the android-36 platform; build-tools 34.0.0 is
        # AGP 8.6.1's default. Keep in sync with app/build.gradle.kts.
        run: sdkmanager "platforms;android-36" "build-tools;34.0.0"

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests and assemble debug APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        # Manual runs only — see the header note on the artifact-storage quota.
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: warden-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload unit test report
        # Only when the build/test step failed — that's the only time it's useful.
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7
