name: Android CI

# Builds the debug APK and runs the JVM unit tests on every push to main, every
# PR, and on demand. The APK is uploaded as a run artifact for sideload testing
# (debug-signed, so it installs without any release keystore). No daemon is
# reachable in CI, so the env-gated LiveDaemonIntegrationTest self-skips.
#
# The app is pure Kotlin + Gradle (no Node/Expo/NDK), so this is much lighter
# than the Expo release-mobile.yml this repo's siblings use — just JDK 17 + the
# Android SDK (android-36 platform, build-tools 34.0.0 = AGP 8.6.1's default).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        # compileSdk 36 needs the android-36 platform; build-tools 34.0.0 is
        # AGP 8.6.1's default. Keep in sync with app/build.gradle.kts.
        run: sdkmanager "platforms;android-36" "build-tools;34.0.0"

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests and assemble debug APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: warden-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
