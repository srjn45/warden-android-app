name: Android Release

# On every pushed tag (v*.*.*), builds a SIGNED release APK with Gradle on the
# runner and publishes a GitHub Release with the APK attached. No Expo/EAS — a
# plain Gradle build has no external build quota or queue.
#
# The APK is signed with the app's stable release keystore (decoded from the
# ANDROID_KEYSTORE_BASE64 secret), so every release shares one signing identity
# and installs as an in-place upgrade over the previous release. This replaces
# the old debug-signed artifact, whose per-run ephemeral debug cert made every
# release fail to install over the last one (signature mismatch).
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64    base64 of the release keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD  keystore (store) password
#   ANDROID_KEY_ALIAS          key alias
#   ANDROID_KEY_PASSWORD       key password
#
# Manual runs (workflow_dispatch, no tag) build + upload the signed APK as a run
# artifact for smoke-testing WITHOUT creating a release.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;34.0.0"

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing — cannot build a signed release." >&2
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Resolve version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VNAME="${GITHUB_REF_NAME#v}"       # v0.2.1 -> 0.2.1
          else
            VNAME="0.0.0-${GITHUB_SHA::7}"
          fi
          echo "APP_VERSION_NAME=$VNAME" >> "$GITHUB_ENV"
          # run_number is monotonic across this workflow's history, so it is a
          # safe ever-increasing versionCode (gaps are fine).
          echo "APP_VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Run unit tests and build signed release APK + AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # assembleRelease → APK for GitHub-release sideloading.
          # bundleRelease  → AAB, the format the Play Store requires for uploads.
          ./gradlew :app:testDebugUnitTest :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace \
            -PappVersionName="$APP_VERSION_NAME" \
            -PappVersionCode="$APP_VERSION_CODE"

      - name: Verify the APK is release-signed and not debuggable
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/34.0.0/apksigner)
          APK=app/build/outputs/apk/release/app-release.apk
          "$APKSIGNER" verify --verbose "$APK"
          DN=$("$APKSIGNER" verify --print-certs "$APK" | grep 'certificate DN' | head -1)
          echo "Signer: $DN"
          if echo "$DN" | grep -q 'Android Debug'; then
            echo "::error::APK is debug-signed — release keystore was not applied." >&2
            exit 1
          fi

      - name: Stage versioned APK + AAB
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            STEM="warden-${GITHUB_REF_NAME}"
          else
            STEM="warden-${GITHUB_SHA::7}"
          fi
          APK_NAME="${STEM}.apk"
          AAB_NAME="${STEM}.aab"
          cp app/build/outputs/apk/release/app-release.apk "$APK_NAME"
          cp app/build/outputs/bundle/release/app-release.aab "$AAB_NAME"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"
          echo "AAB_NAME=$AAB_NAME" >> "$GITHUB_ENV"
          ls -lh "$APK_NAME" "$AAB_NAME"

      # Tag push → publish a GitHub Release with the APK (sideload) + AAB (Play upload).
      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "./$APK_NAME" \
            "./$AAB_NAME" \
            --repo "${{ github.repository }}" \
            --title "Warden $GITHUB_REF_NAME" \
            --generate-notes

      # Manual run (no tag) → keep the APK + AAB as run artifacts instead.
      - name: Upload APK + AAB artifacts
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: warden-release-artifacts
          path: |
            ${{ env.APK_NAME }}
            ${{ env.AAB_NAME }}
          if-no-files-found: error
