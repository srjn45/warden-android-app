name: Android Release

# On every pushed tag (v*.*.*), builds the APK locally with Gradle on the runner
# and publishes a GitHub Release with the APK attached. No Expo/EAS — a plain
# Gradle build has no external build quota or queue.
#
# The artifact is the debug-signed APK: it installs on any device without a
# release keystore, which is what P0 sideload testing needs. When a real signing
# identity exists, add ANDROID_KEYSTORE_BASE64 / *_PASSWORD / ANDROID_KEY_ALIAS
# secrets and a release signingConfig, then switch to :app:assembleRelease.
#
# Manual runs (workflow_dispatch, no tag) build + upload the APK as a run
# artifact for smoke-testing WITHOUT creating a release.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;34.0.0"

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace

      - name: Stage versioned APK
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            APK_NAME="warden-${GITHUB_REF_NAME}.apk"
          else
            APK_NAME="warden-${GITHUB_SHA::7}.apk"
          fi
          cp app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"
          ls -lh "$APK_NAME"

      # Tag push → publish a GitHub Release with the APK attached.
      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "./$APK_NAME" \
            --repo "${{ github.repository }}" \
            --title "Warden $GITHUB_REF_NAME" \
            --generate-notes

      # Manual run (no tag) → keep the APK as a run artifact instead.
      - name: Upload APK artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_NAME }}
          if-no-files-found: error
